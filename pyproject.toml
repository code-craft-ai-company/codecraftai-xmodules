[tool.poetry]
name = "automojo-xmodules"
description = "Automation Mojo - Python Extension Modules"
version = "0.0.1"
authors = []
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="automojo", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
debugpy = "^1.8.14"
automojo-errors = { git = "https://github.com/automationmojo/automojo-errors.git", branch = "main" }
automojo-waiting = { git = "https://github.com/automationmojo/automojo-waiting.git", branch = "main" }


[[tool.poetry.source]]
name = "automationmojo"
url = "https://pypi.pkg.github.com/automationmojo"
priority = "primary"

[[tool.poetry.source]]
name = "PyPI"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
