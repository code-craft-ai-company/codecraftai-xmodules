# Release-event packaging check.
#
# This workflow does NOT publish. Publishing is owned by ``publish.yml``,
# which fires when the version in pyproject.toml changes on main (and on
# demand via workflow_dispatch) and twine-uploads to the Code Craft AI
# package repository at https://artifacts.code-craft.ai/repository/legacy.
#
# Why publishing is not duplicated here: a GitHub release is normally
# created AFTER the version bump that ``publish.yml`` already acted on, so
# a second upload of the same version would be rejected with 409 "Package
# file already exists" and fail the run every time. One publish trigger,
# one publish path.
#
# History, so this is not "fixed" back into a broken state: both workflows
# in this family previously ran
# ``poetry publish --repository github`` against
# ``https://pypi.pkg.github.com/<owner>``. That endpoint does not exist —
# GitHub Packages offers no PyPI-compatible Python registry — so every
# release event failed. The private index it was reaching for now exists;
# it is the artifacts service named above, and ``publish.yml`` is how
# packages get into it.
#
# What is left here is worth keeping on its own: a release event rebuilds
# the distribution and fails loudly if the tagged tree no longer packages
# cleanly.

name: Release Build Validation

on:
  release:
    types: [created]

jobs:
  build-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
          python-version: '3.11'
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    - name: Install Dependencies
      run: poetry install --no-interaction --no-root
    - name: Build package (validate packaging)
      run: poetry build
    - name: Report built artifacts
      run: |
        echo "Packaging validated. These artifacts were built but NOT published:"
        ls -l dist/
        echo ""
        echo "Publishing is handled by publish.yml on a pyproject.toml version change."
